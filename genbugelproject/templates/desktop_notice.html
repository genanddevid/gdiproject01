<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baytruyen</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      text-align: center;
      padding: 40px 24px;
      box-sizing: border-box;
    }
    .wordmark {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 28px;
      color: #B83C2E;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
      margin-bottom: 16px;
      max-width: 320px;
    }
    .body-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: #888;
      line-height: 1.7;
      max-width: 280px;
    }
  </style>
</head>
<body>
  <div>
    <p class="wordmark">Baytruyen</p>
    <h1 class="headline">Built for mobile, for now.</h1>
    <p class="body-text">Baytruyen isn't ready for desktop just yet. Please open this page on your phone to continue.</p>
  </div>
</body>
</html>
