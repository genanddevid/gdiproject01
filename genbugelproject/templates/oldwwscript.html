<script>
(function() {
  let selectedWord = '';
  let audioUrl = '';
  cambridgeAudio = '';
  let vocabAudio = '';
  let mwAudio = '';
  let currentLang = localStorage.getItem('writeword_lang') || 'vi';

  function getLangConfig(lang) {
    const configs = {
      vi: { mmCode: 'vi', voiceLocale: 'vi-VN', label: 'Vietnamese', rtl: false },
      ar: { mmCode: 'ar', voiceLocale: 'ar-SA', label: 'Arabic', rtl: true },
      ur: { mmCode: 'ur', voiceLocale: 'ur-PK', label: 'Urdu', rtl: true },
      ml: { mmCode: 'ml', voiceLocale: 'ml-IN', label: 'Malayalam', rtl: false }
    };
    return configs[lang] || configs.vi;
  }

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }


  function handleMultiWordLookup(phrase) {
    const body = document.getElementById('writeword-body');

    fetch('/writeword-translate-phrase/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ phrase: phrase, lang_code: currentLang })
    })
      .then(r => r.json()).catch(() => null)
      .then(translationData => {
        let translation = (translationData && translationData.translation) || '—';


        body.innerHTML = `
          <div class="ww-word">${selectedWord}</div>

          <div style="display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;">
            ${['vi', 'ar', 'ur', 'ml'].map(function(l) {
              return `<button id="ww-lang-${l}" onclick="switchWriteWordLang('${l}')"
                style="background:${currentLang === l ? '#333' : 'transparent'}; color:#fff; border:1px solid #333;
                border-radius:50px; padding:4px 12px; font-size:11px; font-weight:600; cursor:pointer;">${l.toUpperCase()}</button>`;
            }).join('')}
          </div>

          <div class="ww-section" id="ww-translation-section">
            ${renderTranslationHtml(translation, currentLang)}
          </div>
          <div class="ww-section" id="ww-ai-section">
            <div class="ww-divider"></div>
            <div class="ww-loading" id="ww-ai-loading">
              <div class="ww-spinner"></div>
              Looking up "${selectedWord}"...
            </div>
          </div>
        `;

        fetch('/writeword-explain/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken'),
          },
          body: JSON.stringify({ word: selectedWord })
        })
        .then(r => r.json())
        .then(data => {
          const aiSection = document.getElementById('ww-ai-section');
          if (aiSection) {
            aiSection.innerHTML = `
              <div class="ww-divider"></div>
              <div class="ww-section-content">${data.explanation || '—'}</div>
              <div class="ww-section-label">About • AI</div>
            `;
          }
        })
        .catch(() => {
          const aiSection = document.getElementById('ww-ai-section');
          if (aiSection) {
            aiSection.innerHTML = `
              <div class="ww-divider"></div>
              <div class="ww-section-content" style="color:#555;">Could not load explanation. Tap the phrase again to retry.</div>
            `;
          }
        });
      });
  }


  // Detect single word selection inside modal
  function onSelectionChange() {
    const toolbar = document.getElementById('writeword-toolbar');
    if (!toolbar) return;

    // ---- 1. Narrative Builder textarea selection ----
    try {
      const active = document.activeElement;
      if (
        active &&
        (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT') &&
        (active.name === 'content' || active.name === 'caption') &&
        typeof active.selectionStart === 'number' &&
        typeof active.selectionEnd === 'number'
      ) {
        const start = active.selectionStart;
        const end = active.selectionEnd;

        if (start === end) {
          toolbar.style.display = 'none';
          return;
        }

        const text = active.value.substring(start, end).trim();
        const wordCount = text.split(/\s+/).filter(Boolean).length;

        if (!text || wordCount > 6 || text.length < 2) {
          toolbar.style.display = 'none';
          return;
        }

        selectedWord = text;

        const rect = active.getBoundingClientRect();
        let left = rect.left + (rect.width / 2);
        let top = rect.top - 55;

        const toolbarWidth = 150;
        if (left < toolbarWidth / 2) left = toolbarWidth / 2;
        if (left > window.innerWidth - toolbarWidth / 2) left = window.innerWidth - toolbarWidth / 2;
        if (top < 10) top = rect.bottom + 10;

        toolbar.style.left = left + 'px';
        toolbar.style.top = top + 'px';
        toolbar.style.display = 'block';
        return;
      }
    } catch (e) {
      // .selectionStart throws on some input types — ignore, fall through
    }

    // ---- 2. Normal page text (articles, Review/Improve panels) ----
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !selection.toString().trim()) {
      toolbar.style.display = 'none';
      return;
    }

    const text = selection.toString().trim();
    const wordCount = text.split(/\s+/).filter(Boolean).length;
    if (wordCount > 6 || text.length < 2) {
      toolbar.style.display = 'none';
      return;
    }

    const modalBody = document.getElementById('modalBody');
    const reviewResults = document.getElementById('reviewResults');
    const originalText = document.getElementById('originalText');
    const improvedText = document.getElementById('improvedText');
    const anchorNode = selection.anchorNode;
    const inModal = modalBody && modalBody.contains(anchorNode);
    const inReview = reviewResults && reviewResults.contains(anchorNode);
    const inImprove = (originalText && originalText.contains(anchorNode)) || (improvedText && improvedText.contains(anchorNode));

    if (!anchorNode || !(inModal || inReview || inImprove)) {
      toolbar.style.display = 'none';
      return;
    }

    selectedWord = text;

    const range = selection.getRangeAt(0);
    const rect = range.getBoundingClientRect();
    toolbar.style.left = (rect.left + rect.width / 2) + 'px';
    toolbar.style.top = (rect.bottom + 27) + 'px';
    toolbar.style.display = 'block';
}


 document.addEventListener('mouseup', onSelectionChange);
document.addEventListener('selectionchange', function() {
    clearTimeout(window._wwTimer);
    window._wwTimer = setTimeout(onSelectionChange, 300);
});
document.addEventListener('touchend', function() {
    clearTimeout(window._wwTimer);
    window._wwTimer = setTimeout(onSelectionChange, 300);
});
  // Hide toolbar when clicking elsewhere
 

  // Open Writeword modal
  window.openWriteword = function() {

  console.log('OPENING:', selectedWord);

  if (!selectedWord) {
    alert('No word selected');
    return;
  }

  fetch('/log-writeword-lookup/', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': getCookie('csrftoken'),
    },
    body: JSON.stringify({ word: selectedWord })
  }).catch(() => {});


    const toolbar = document.getElementById('writeword-toolbar');
    toolbar.style.display = 'none';

    const overlay = document.getElementById('writeword-overlay');
    const body = document.getElementById('writeword-body');

    // Show loading
    body.innerHTML = `
      <div class="ww-loading">
        <div class="ww-spinner"></div>
        Looking up "${selectedWord}"...
      </div>
    `;

    overlay.classList.add('active');

    // Fetch both APIs in parallel
    const word = selectedWord.toLowerCase();

    const wwWordCount = selectedWord.trim().split(/\s+/).filter(Boolean).length;
    if (wwWordCount > 1) {
      handleMultiWordLookup(word);
      return;
    }

    Promise.all([
  fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(word)}&langpair=en|${getLangConfig(currentLang).mmCode}`)
    .then(r => r.json()).catch(() => null),

  fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`)
    .then(r => r.json()).catch(() => null),

  fetch(`https://www.dictionaryapi.com/api/v3/references/collegiate/json/${encodeURIComponent(word)}?key=35a925b3-314a-4dd8-b123-0ee55bce39bc`)
    .then(r => r.json()).catch(() => null),

  fetch(`/vocabulary-lookup/?word=${encodeURIComponent(word)}`)
    .then(r => r.json()).catch(() => null),

  fetch(`/wordreference-lookup/?word=${encodeURIComponent(word)}`)
    .then(r => r.json()).catch(() => null),

fetch(`/cambridge-lookup/?word=${encodeURIComponent(word)}`)
    .then(r => r.json()).catch(() => null)

]).then(([translationData, dictData, mwData, vocabData, wrData, cambridgeData]) => {
      // Extract translation
      let translation = '—';
      if (translationData && translationData.responseStatus === 200) {
        translation = translationData.responseData.translatedText || '—';
      }

      // Extract phonetic and audio
      let phonetic = '';
      audioUrl = '';
      let cambridgeAudioUrl = '';
      let definition = '—';
      let isEntity = false;
      // Pronunciations from different sources
let dictPronunciation = 'Pronunciation unavailable';
let cambridgePronunciation = 'Pronunciation unavailable';
let vocabPronunciation = 'Pronunciation unavailable';
let wrPronunciation = 'Pronunciation unavailable';


      if (Array.isArray(dictData) && dictData.length > 0) {
        const entry = dictData[0];

        // Phonetics
        if (entry.phonetics && entry.phonetics.length > 0) {
          for (const p of entry.phonetics) {
            if (p.text) phonetic = phonetic || p.text;
            if (p.audio) audioUrl = audioUrl || p.audio;
          }
        }
        if (!phonetic && entry.phonetic) phonetic = entry.phonetic;
        dictPronunciation = phonetic || 'Pronunciation unavailable';

        // Definition
        if (entry.meanings && entry.meanings.length > 0) {
          const meaning = entry.meanings[0];
          const partOfSpeech = meaning.partOfSpeech || '';
          const def = meaning.definitions && meaning.definitions[0]
            ? meaning.definitions[0].definition
            : '—';
          definition = partOfSpeech
    ? `<em style="color:#fff; font-size:12px;">${partOfSpeech}</em> — ${def}`
    : def;
        }
      } else {
        // Dictionary returned nothing — likely an entity
        isEntity = true;
      }

      // Extract Merriam-Webster definitiolet mwDefinition = '—';
      let mwPartOfSpeech = '';

      let vocabDefinition = 'Definition unavailable';
      let vocabPartOfSpeech = '';

      if (vocabData) {

    if (vocabData.definition) {
        vocabDefinition = vocabData.definition;
    }

    if (vocabData.partOfSpeech) {
        vocabPartOfSpeech = vocabData.partOfSpeech;
    }

    if (vocabData.pronunciation) {
        vocabPronunciation = vocabData.pronunciation;
    }

    if (vocabData.audio) {
        vocabAudio = vocabData.audio;
    }
    console.log("Vocabulary audio:", vocabAudio);

}

      let wrDefinition = 'Definition unavailable';
      let wrPartOfSpeech = '';
      

      if (wrData) {

          if (wrData.definition) {
              wrDefinition = wrData.definition;
          }

          if (wrData.partOfSpeech) {
              wrPartOfSpeech = wrData.partOfSpeech;
          }

      }

      
      const posMap = {
    'n.': 'noun',
    'v.': 'verb',
    'v.t.': 'transitive verb',
    'v.i.': 'intransitive verb',
    'adj.': 'adjective',
    'adv.': 'adverb'
};



wrPartOfSpeech = posMap[wrPartOfSpeech] || wrPartOfSpeech;
let cambridgeDefinition = 'Definition unavailable';
let cambridgePartOfSpeech = '';

if (cambridgeData) {

    if (cambridgeData.pronunciation) {
        cambridgePronunciation = cambridgeData.pronunciation;
    }

    if (cambridgeData.audio) {
        cambridgeAudio = cambridgeData.audio;
    }

    if (cambridgeData.definition) {
        cambridgeDefinition = cambridgeData.definition;
    }

    if (cambridgeData.partOfSpeech) {
        cambridgePartOfSpeech = cambridgeData.partOfSpeech;
    }
}


      
      let mwPronunciation = 'Pronunciation unavailable';
      mwAudio = '';

      if (Array.isArray(mwData) && mwData.length > 0 && typeof mwData[0] === 'object') {
        const mwEntry = mwData[0];
        mwPartOfSpeech = mwEntry.fl || '';
        if (mwEntry.shortdef && mwEntry.shortdef.length > 0) {
          mwDefinition = mwEntry.shortdef[0];
          isEntity = false;
        }
        if (mwEntry.hwi && mwEntry.hwi.prs && mwEntry.hwi.prs.length > 0) {
          const pr = mwEntry.hwi.prs[0];
          if (pr.mw) mwPronunciation = pr.mw;
          if (pr.sound && pr.sound.audio) {
            const audioFile = pr.sound.audio;
            let subdir;
            if (audioFile.startsWith('bix')) subdir = 'bix';
            else if (audioFile.startsWith('gg')) subdir = 'gg';
            else if (/^[^a-zA-Z]/.test(audioFile)) subdir = 'number';
            else subdir = audioFile.charAt(0);
            mwAudio = `https://media.merriam-webster.com/audio/prons/en/us/mp3/${subdir}/${audioFile}.mp3`;
          }
        }
      }


      const dictAvailable = definition !== '—';

      const mwAvailable = mwDefinition !== '—';

      const cambridgeAvailable =
          cambridgePronunciation !== 'Pronunciation unavailable';

      const dictPronunciationAvailable =
          dictPronunciation !== 'Pronunciation unavailable';

      const vocabPronunciationAvailable =
          vocabPronunciation !== 'Pronunciation unavailable';

      const mwPronunciationAvailable =
          mwPronunciation !== 'Pronunciation unavailable';

      const vocabAvailable =
          !!vocabDefinition &&
          vocabDefinition !== 'Definition unavailable';

      const wrAvailable =
          !!wrDefinition &&
          wrDefinition !== 'Definition unavailable';

      const cambridgeDefAvailable =
          !!cambridgeDefinition &&
          cambridgeDefinition !== 'Definition unavailable';

      const dictLink = `https://www.dictionary.com/browse/${word}`;
      const mwLink = `https://www.merriam-webster.com/dictionary/${word}`;
      const vocabLink = `https://www.vocabulary.com/dictionary/${word}`;
      const wrLink = `https://www.wordreference.com/definition/${word}`;
      const cambridgeLink = `https://dictionary.cambridge.org/dictionary/english/${word}`;

      const mwFullText = (mwPartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${mwPartOfSpeech}</em> — ` : '') + (mwDefinition || '');
      const vocabFullText = (vocabPartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${vocabPartOfSpeech}</em> — ` : '') + (vocabDefinition || '');      
      const wrFullText = (wrPartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${wrPartOfSpeech}</em> — ` : '') + (wrDefinition || 'Definition unavailable');
      const cambridgeFullText = (cambridgePartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${cambridgePartOfSpeech}</em> — ` : '') + cambridgeDefinition;

      const cambridgeSlideHtml = `
              <div style="min-width:100%; box-sizing:border-box;"
                   data-source="cambridge.org"
                   data-link="${cambridgeLink}"
                   data-full="${cambridgeFullText.replace(/"/g, '&quot;')}">
                <div class="ww-section-content">
                    ${cambridgePartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${cambridgePartOfSpeech}</em> — ` : ''}
                    ${cambridgeDefinition.length > 120
                        ? cambridgeDefinition.substring(0, 120) + `...<a href="${cambridgeLink}" target="_blank" style="text-decoration:underline; color:#ffffff; font-size:10px;">Read more</a>`
                        : cambridgeDefinition}
                </div>
                <div class="ww-section-label" style="margin-top:8px;">
                    <a href="${cambridgeLink}" target="_blank" style="color:#0d5cab; text-decoration:none; display:block;">Cambridge Dictionary</a>
                    <span style="font-size:8px; color:#555;">https://dictionary.cambridge.org</span>
                </div>
              </div>`;
      
      

      const mwSlideHtml = `
              <div style="min-width:100%; box-sizing:border-box;" 
                   data-source="merriam-webster.com" 
                   data-link="${mwLink}" 
                   data-full="${mwFullText.replace(/"/g, '&quot;')}">
                   <div class="ww-section-content">
    ${mwPartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${mwPartOfSpeech}</em> — ` : ''}
    ${mwDefinition}
</div>
              <div class="ww-section-label" style="margin-top:8px;">
    <a href="${mwLink}" target="_blank" style="color:#0d5cab; text-decoration:none; display:block;">Merriam-Webster.com</a>
    <span style="font-size:8px; color:#555;">https://www.merriam-webster.com</span>
</div>
                </div>`;

      const vocabSlideHtml = `
              <div style="min-width:100%; box-sizing:border-box;"
                   data-source="vocabulary.com"
                   data-link="${vocabLink}"
                   data-full="${vocabFullText.replace(/"/g, '&quot;')}">
                <div class="ww-section-content">
    ${vocabPartOfSpeech ? `<em style="color:#ccc;font-size:12px;">${vocabPartOfSpeech}</em> — ` : ''}
  ${vocabDefinition
      ? (vocabDefinition.length > 120
          ? vocabDefinition.substring(0, 120).replace(/\s+\S*$/, '') +
            `...<a href="${vocabLink}" target="_blank" style="text-decoration: underline; color:#ffffff; font-size:10px;">Read more</a>`
          : vocabDefinition)
      : 'Definition unavailable'}
</div>
                  <div class="ww-section-label" style="margin-top:8px;">
    <a href="${vocabLink}" target="_blank" style="color:#0d5cab; text-decoration:none; display:block;">Vocabulary.com</a>
    <span style="font-size:8px; color:#555;">https://www.vocabulary.com</span>
</div>
              </div>`;

      const wrSlideHtml = `
          <div style="min-width:100%; box-sizing:border-box;"
            data-source="wordreference.com"
            data-link="${wrLink}"
            data-full="${wrFullText.replace(/"/g, '&quot;')}">
                ${wrPartOfSpeech ? `<em style="color:#555;font-size:12px;">${wrPartOfSpeech}</em><br>` : ''}
                <div class="ww-section-content">
                      ${wrDefinition
                      ? (wrDefinition.length > 120 ? wrDefinition.substring(0, 120) + '...' : wrDefinition + '...')
                      : 'Definition unavailable'}
                    <a href="${wrLink}" target="_blank" style="text-decoration: underline; color:#ffffff; font-size:10px;">Read more</a>
                </div>
                <div class="ww-section-label" style="margin-top:8px;">
                  <a href="${wrLink}" target="_blank" style="color:#0d5cab; text-decoration:none; display:block;">Wordreference.com</a>
                  <span style="font-size:8px; color:#555;">https://www.wordreference.com</span>
                </div>
              </div>`;

      const dictSlideHtml = `
              <div style="min-width:100%; box-sizing:border-box;" 
                   data-source="dictionary.com" 
                   data-link="${dictLink}" 
                   data-full="${definition.replace(/"/g, '&quot;')}">
                <div class="ww-section-content">${definition}</div>
                <div class="ww-section-label" style="margin-top:8px;">
    <a href="${dictLink}" target="_blank" style="color:#0d5cab; text-decoration:none; display:block;">Dictionary.com</a>
    <span style="font-size:8px; color:#555;">https://www.dictionary.com</span>
</div>
              </div>`;

      

      const allDefSlides = [];
      if (cambridgeDefAvailable) allDefSlides.push({ source: 'cambridge.org', link: cambridgeLink, full: cambridgeFullText, html: cambridgeSlideHtml });
      if (mwAvailable) allDefSlides.push({ source: 'merriam-webster.com', link: mwLink, full: mwFullText, html: mwSlideHtml });
      if (vocabAvailable) allDefSlides.push({ source: 'vocabulary.com', link: vocabLink, full: vocabFullText, html: vocabSlideHtml });
      if (wrAvailable) allDefSlides.push({ source: 'wordreference.com', link: wrLink, full: wrFullText, html: wrSlideHtml });
      if (dictAvailable) allDefSlides.push({ source: 'dictionary.com', link: dictLink, full: definition, html: dictSlideHtml });
            
      window._wwAllDefSlides = allDefSlides;
      const visibleDefSlides = allDefSlides.slice(0, 3);

      const dictPronLink = 'https://www.dictionary.com';
      const cambridgePronLink = 'https://dictionary.cambridge.org';
      const vocabPronLink = 'https://www.vocabulary.com';
      const mwPronLink = 'https://www.merriam-webster.com';

       const vocabPronSlideHtml = `
    <div style="min-width:100%; box-sizing:border-box;"
      data-source="Vocabulary.com" data-link="${vocabPronLink}"
      data-full="${vocabPronunciation}" data-audio="${vocabAudio}">
    <div class="ww-pronunciation-main">
        <span class="ww-phonetic">${vocabPronunciation}</span>
        ${vocabAudio ? `<button class="ww-audio-btn" onclick="playVocabularyAudio()" title="Listen">▶</button>` : ''}
    </div>
    <div class="ww-section-label" style="margin-top:10px;">
    <a href="${vocabPronLink}" target="_blank"
       style="font-size:9px;color:#0d5cab;text-decoration:none;display:block;">
        Vocabulary.com
    </a>
    <div style="font-size:8px;color:#555;">${vocabPronLink}</div>
</div>
</div>`;

      
      

      const cambridgePronSlideHtml = `
      <div style="min-width:100%; box-sizing:border-box;"
        data-source="Cambridge" data-link="${cambridgePronLink}"
        data-full="${cambridgePronunciation}" data-audio="${cambridgeAudio}">
        <div class="ww-pronunciation-main">
          <span class="ww-phonetic">${cambridgePronunciation}</span>
            ${cambridgeAudio ? `<button class="ww-audio-btn" onclick="playCambridgeAudio()" title="Listen">▶</button>` : ''}
        </div>
        <div class="ww-section-label" style="margin-top:10px;">
  <a href="${cambridgePronLink}" target="_blank"
     style="font-size:9px;color:#0d5cab;text-decoration:none;display:block;">
    Cambridge
  </a>
  <div style="font-size:8px;color:#555;">${cambridgePronLink}</div>
</div>
      </div>`;

     
      const mwPronSlideHtml = `
    <div style="min-width:100%; box-sizing:border-box;"
      data-source="Merriam-Webster" data-link="${mwPronLink}"
      data-full="${mwPronunciation}" data-audio="${mwAudio}">
    <div class="ww-pronunciation-main">
        <span class="ww-phonetic">${mwPronunciation}</span>
        ${mwAudio ? `<button class="ww-audio-btn" onclick="playMWAudio()" title="Listen">▶</button>` : ''}
    </div>
    <div class="ww-section-label" style="margin-top:10px;">
    <a href="${mwPronLink}" target="_blank"
       style="font-size:9px;color:#0d5cab;text-decoration:none;display:block;">
        Merriam-Webster
    </a>
    <div style="font-size:8px;color:#555;">${mwPronLink}</div>
</div>
</div>`;


    const dictPronSlideHtml = `
      <div style="min-width:100%; box-sizing:border-box;"
          data-source="Dictionary.com" data-link="${dictPronLink}"
          data-full="${dictPronunciation}" data-audio="${audioUrl}">
        <div class="ww-pronunciation-main">
          <span class="ww-phonetic">${dictPronunciation}</span>
          ${audioUrl ? `<button class="ww-audio-btn" onclick="playAudio()" title="Listen">▶</button>` : ''}
        </div>
        <div class="ww-section-label" style="margin-top:10px;">
    <a href="${dictPronLink}" target="_blank"
       style="font-size:9px;color:#0d5cab;text-decoration:none;display:block;">
        Dictionary.com
    </a>
    <div style="font-size:8px;color:#555;">${dictPronLink}</div>
</div>
      </div>`;

      const allPronSlides = [];
      if (vocabPronunciationAvailable) allPronSlides.push({ source: 'Vocabulary.com', link: vocabPronLink, full: vocabPronunciation, audio: vocabAudio, html: vocabPronSlideHtml });
      if (cambridgeAvailable) allPronSlides.push({ source: 'Cambridge', link: cambridgePronLink, full: cambridgePronunciation, audio: cambridgeAudio, html: cambridgePronSlideHtml });
      if (mwPronunciationAvailable) allPronSlides.push({ source: 'Merriam-Webster', link: mwPronLink, full: mwPronunciation, audio: mwAudio, html: mwPronSlideHtml });
      if (dictPronunciationAvailable) allPronSlides.push({ source: 'Dictionary.com', link: dictPronLink, full: dictPronunciation, audio: audioUrl, html: dictPronSlideHtml });

      window._wwAllPronSlides = allPronSlides;
      const visiblePronSlides = allPronSlides.slice(0, 3);





      // Render modal

  // Play audio
  function renderTranslationHtml(translation, lang) {
    const cfg = getLangConfig(lang);
    const isRtl = cfg.rtl;
    return `
      <div class="ww-pronunciation-main" style="margin-bottom:6px; justify-content:flex-start;">
        <span class="ww-section-content ww-translation"${isRtl ? ' dir="rtl" style="font-family:Arial, sans-serif;"' : ''}>${translation}</span>
        ${translation !== '—' ? `
        <button class="ww-audio-btn" onclick="playTranslation('${translation.replace(/'/g, "\\'")}')" title="Listen">
            ▶
        </button>` : ''}
      </div>
      <div class="ww-section-label">
       ${cfg.label} <span style="color:#999999; font-size:9px; font-weight:600;">Translation</span><!-- • <a href="https://mymemory.translated.net/" target="_blank" style="color:#0d5cab; text-decoration:none;">MyMemory</a> -->
      `;
       }

  window.switchWriteWordLang = function(lang) {
    if (lang === currentLang) return;
    currentLang = lang;
    localStorage.setItem('writeword_lang', lang);

    ['vi', 'ar', 'ur', 'ml'].forEach(function(l) {
      const btn = document.getElementById('ww-lang-' + l);
      if (btn) btn.style.background = lang === l ? '#333' : 'transparent';
    });

    const section = document.getElementById('ww-translation-section');
    if (section) {
      section.innerHTML = `<div class="ww-loading" style="padding:8px 0;"><div class="ww-spinner"></div>Translating...</div>`;
    }

    const cfg = getLangConfig(lang);
    const wwSwitchWordCount = selectedWord.trim().split(/\s+/).filter(Boolean).length;

    if (wwSwitchWordCount > 1) {
      fetch('/writeword-translate-phrase/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({ phrase: selectedWord, lang_code: lang })
      })
        .then(r => r.json())
        .then(data => {
          const translation = (data && data.translation) || '—';
          if (section) section.innerHTML = renderTranslationHtml(translation, lang);
        })
        .catch(() => {
          if (section) section.innerHTML = renderTranslationHtml('—', lang);
        });
      return;
    }

    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(selectedWord.toLowerCase())}&langpair=en|${cfg.mmCode}`)
      .then(r => r.json())
      .then(data => {
        let translation = '—';
        if (data && data.responseStatus === 200) {
          translation = data.responseData.translatedText || '—';
        }
        if (section) section.innerHTML = renderTranslationHtml(translation, lang);
      })
      .catch(() => {
        if (section) section.innerHTML = renderTranslationHtml('—', lang);
      });
  };

  // Play audio
  window.playAudio = function() {

    if (!audioUrl) return;
    const audio = new Audio(audioUrl);
    audio.play().catch(() => {});
  };

  window.playCambridgeAudio = function() {

  window.playTranslation = function(text) {
    if (!text || text === '—') return;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = getLangConfig(currentLang).voiceLocale;
    utterance.rate = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utterance);
  };

    if (e && e.target !== document.getElementById('writeword-overlay')) return;
    document.getElementById('writeword-overlay').classList.remove('active');
